<!doctype html>
<html lang="is">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Raddir — ný heimasíða er væntanleg.">
    <meta name="theme-color" content="#302630">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <title>Raddir — væntanlegt</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #302630;
        color: #f5f0e5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: 100%; max-width: 48rem; text-align: center; }
      .logo { display: block; width: 112px; height: 88px; margin: 0 auto 3rem; }
      h1 { margin: 0; font-size: clamp(3rem, 12vw, 6.5rem); font-weight: 600; letter-spacing: -0.055em; line-height: 1.15; }
      .status { margin: 1.5rem 0 0; color: #e8b394; font-size: 1rem; letter-spacing: 0.2em; text-transform: uppercase; }
      .message { margin: 2rem 0 0; font-size: 1.125rem; line-height: 1.7; }
      footer { margin-top: 5rem; color: #c9b9c5; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="logo.svg" alt="" width="112" height="88">
      <h1>Raddir</h1>
      <p class="status">Væntanlegt</p>
      <p class="message">Ný heimasíða er í vinnslu.<br>Við hlökkum til að taka á móti þér.</p>
      <footer>raddir.is</footer>
    </main>
  </body>
</html>
